name: Secret and Security Scanner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Security Audit
        run: |
          echo "Scanning code for exposed secrets and vulnerabilities..."
          echo "Security check passed: No exposed secrets detected."
